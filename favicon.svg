<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Vibrant Gradient Accent -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Rim Light Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Glass Coating Gradient -->
    <linearGradient id="lensGlass" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="40%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  
  <!-- Subtle Border / Rim -->
  <rect x="8" y="8" width="496" height="496" rx="112" fill="none" stroke="url(#rimGrad)" stroke-width="10"/>

  <!-- Camera Body Silhouette -->
  <!-- Viewfinder bump -->
  <path d="M 196 142 C 204 126, 218 116, 236 116 L 276 116 C 294 116, 308 126, 316 142 Z" fill="url(#accentGrad)"/>
  
  <!-- Shutter Button -->
  <rect x="120" y="132" width="44" height="14" rx="7" fill="#94a3b8"/>

  <!-- Main Camera Frame -->
  <rect x="84" y="146" width="344" height="250" rx="44" fill="#18181b" stroke="url(#accentGrad)" stroke-width="14"/>

  <!-- Top Flash Dot / Sensor -->
  <circle cx="370" cy="195" r="14" fill="url(#accentGrad)"/>
  <circle cx="370" cy="195" r="7" fill="#ffffff"/>

  <!-- Lens Outer Ring with Glow -->
  <circle cx="256" cy="272" r="92" fill="url(#lensGlass)" stroke="url(#accentGrad)" stroke-width="16" filter="url(#glow)"/>

  <!-- Lens Inner Ring -->
  <circle cx="256" cy="272" r="64" fill="#09090b" stroke="#38bdf8" stroke-width="6"/>

  <!-- Aperture Core / Pupil -->
  <circle cx="256" cy="272" r="38" fill="url(#accentGrad)"/>

  <!-- Lens Optical Reflection Flare -->
  <ellipse cx="236" cy="250" rx="18" ry="10" transform="rotate(-30 236 250)" fill="#ffffff" opacity="0.65"/>
  <circle cx="274" cy="292" r="5" fill="#ffffff" opacity="0.45"/>
</svg>
